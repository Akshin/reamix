[project]
name = "reamix"
version = "0.1.0"
description = "Сведение в REAPER руками Claude: мост, снимки состояния, каталог плагинов"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pyloudnorm>=0.2.0",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
]

[project.scripts]
reamix = "reamix.cli:main"

[dependency-groups]
dev = ["pytest>=8", "lupa>=2.4"]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
